<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Debryne New Age Bank</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="bank-container"><div class="logo-area">
    <div class="logo">D</div>

    <h1>DEBRYNE</h1>
    <p>NEW AGE BANK</p>
</div>

<div class="welcome">
    <h2>Create Account 🏦</h2>
    <p>Join Debryne New Age Bank today</p>
</div>

<form id="signupForm">

    <label>Full Name</label>
    <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
    >

    <label>Email Address</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label>Phone Number</label>
    <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        required
    >

    <label>Password</label>

    <div class="password-box">
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="button" id="showPassword">
            👁️
        </button>
    </div>

    <label>Confirm Password</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
    >

    <div class="terms">
        <input type="checkbox" id="terms" required>

        <span>
            I agree to the Terms & Conditions and Privacy Policy.
        </span>
    </div>

    <button type="submit" class="login-btn">
        CREATE ACCOUNT
    </button>

</form>

<div class="back-login">
    Already have an account?
    <a href="login.html">Login</a>
</div>

<p class="security">
    🔒 Your information is securely protected
</p>

<footer>
    <p>© 2026 Debryne New Age Bank</p>
    <p>Banking Beyond Today.</p>
</footer>

</div><!-- FIREBASE --><script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyChb5YDplwEUqxYBQdkpNTlqk6XyrZ9v6s",

        authDomain:
        "debryne-new-age-bank.firebaseapp.com",

        projectId:
        "debryne-new-age-bank",

        storageBucket:
        "debryne-new-age-bank.firebasestorage.app",

        messagingSenderId:
        "712684201242",

        appId:
        "1:712684201242:web:5ab3dc41734dec5e3a78a3",

        measurementId:
        "G-NP062V5XTZ"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* SHOW / HIDE PASSWORD */

    const showPassword =
        document.getElementById("showPassword");

    const password =
        document.getElementById("password");


    showPassword.addEventListener("click", () => {

        if (password.type === "password") {

            password.type = "text";

            showPassword.textContent = "🙈";

        } else {

            password.type = "password";

            showPassword.textContent = "👁️";
        }

    });


    /* CREATE ACCOUNT */

    const signupForm =
        document.getElementById("signupForm");


    signupForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const passwordValue =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* CHECK PASSWORD */

        if (passwordValue !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        /* CREATE FIREBASE ACCOUNT */

        try {

            await createUserWithEmailAndPassword(
                auth,
                email,
                passwordValue
            );


            alert(
                "Account created successfully! Welcome to Debryne New Age Bank."
            );


            window.location.href =
                "dashboard.html";


        } catch (error) {

            console.error(error);


            if (error.code === "auth/email-already-in-use") {

                alert(
                    "This email address is already registered."
                );


            } else if (error.code === "auth/weak-password") {

                alert(
                    "Password is too weak. Please use at least 6 characters."
                );


            } else if (error.code === "auth/invalid-email") {

                alert(
                    "Please enter a valid email address."
                );


            } else {

                alert(
                    "Account creation failed: " + error.message
                );

            }

        }

    });

</script></body>
</html>
