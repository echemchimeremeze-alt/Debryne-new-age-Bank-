<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Debryne New Age Bank</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="bank-container"><div class="logo-area">

    <div class="logo">D</div>

    <h1>DEBRYNE</h1>

    <p>NEW AGE BANK</p>

</div>


<div class="welcome">

    <h2>Welcome Back 🏦</h2>

    <p>
        Login to your Debryne New Age Bank account
    </p>

</div>


<form id="loginForm">

    <label>Email Address</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >


    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="button"
            id="showPassword"
        >
            👁️
        </button>

    </div>


    <button
        type="submit"
        class="login-btn"
        id="loginBtn"
    >
        LOGIN
    </button>

</form>


<div class="back-login">

    Don't have an account?

    <a href="index.html">
        Create Account
    </a>

</div>


<p class="security">
    🔒 Your information is securely protected
</p>


<footer>

    <p>
        © 2026 Debryne New Age Bank
    </p>

    <p>
        Banking Beyond Today.
    </p>

</footer>

</div><script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword
    }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
        "AIzaSyChb5YDplwEUqxYBQdkpNTlqK6XyrZ9v6s",

        authDomain:
        "debryne-new-age-bank.firebaseapp.com",

        projectId:
        "debryne-new-age-bank",

        storageBucket:
        "debryne-new-age-bank.firebasestorage.app",

        messagingSenderId:
        "712684201242",

        appId:
        "1:712684201242:web:5ab3dc41734dec5e3a78a3",

        measurementId:
        "G-NP062V5XTZ"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* SHOW / HIDE PASSWORD */

    const showPassword =
        document.getElementById("showPassword");

    const passwordInput =
        document.getElementById("password");


    showPassword.addEventListener("click", () => {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            showPassword.textContent = "🙈";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "👁️";

        }

    });


    /* LOGIN */

    const loginForm =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");


    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const password =
            passwordInput.value;


        loginBtn.disabled = true;

        loginBtn.textContent =
            "LOGGING IN...";


        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "LOGIN SUCCESS:",
                userCredential.user.email
            );


            alert(
                "Login successful! Welcome back."
            );


            window.location.href =
                "dashboard.html";


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "LOGIN";


            alert(
                "LOGIN ERROR:\n\n" +
                error.code +
                "\n\n" +
                error.message
            );

        }

    });

</script></body></html>
